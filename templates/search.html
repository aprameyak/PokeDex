<!DOCTYPE html>
<html>
<head>
  <title>Pokedex Search</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <div class="search-results">
    <!-- VULNERABLE: search term rendered with | safe — disables Jinja2 autoescaping -->
    <h2>Search results for: {{ search | safe }}</h2>
    <p>{{ count }} Pokemon found</p>
    <ul>
      {% for p in results %}
        <li><strong>#{{ p.id }} {{ p.name }}</strong> &mdash; {{ p.type1 }}</li>
      {% endfor %}
    </ul>
    <a href="/">Back to Pokedex</a>
  </div>
</body>
</html>
